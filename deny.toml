# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Uses cargo-deny 0.16+ format (opt-in via `version = 2` markers).

[advisories]
version = 2
# Scope of unmaintained check: "all", "workspace", "transitive", "none"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Allowed licenses across all dependencies in the workspace
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Deny crates from unknown registries — prevents dependency confusion attacks
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
